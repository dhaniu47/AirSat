<!DOCTYPE html>

<html>

<head>

<title>AirSat AI</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script src="https://unpkg.com/leaflet.heat/dist/leaflet-heat.js"></script>

<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.css"/>

<script src="https://unpkg.com/leaflet.markercluster/dist/leaflet.markercluster.js"></script>


<style>

html, body {

  margin:0;

  padding:0;

  height:100%;

  overflow:hidden;

  font-family:Arial;

}


#map {

  height:100%;

  width:100%;

}


#map.dark-map .leaflet-tile {

  filter: invert(1) hue-rotate(180deg) brightness(.78) contrast(1.08);

}


.blink {

  animation: blinkAnim 0.8s infinite alternate;

}


@keyframes blinkAnim {

  from {

    color: red;

  }

  to {

    color: black;

  }

}


#topBar {

  position:absolute;

  top:0;

  left:0;

  width:100%;

  box-sizing:border-box;

  background:rgba(0,0,0,0.7);

  color:white;

  padding:10px;

  z-index:5000;

  display:flex;

  align-items:center;

  gap:8px;

}


#topBar span {

  margin-right:auto;

}


#topBar button {

  cursor:pointer;

}


#searchBox {

  position:absolute;

  top:70px;

  left:50%;

  transform:translateX(-50%);

  padding:8px;

  width:260px;

  border-radius:20px;

  border:1px solid #ccc;

  z-index:2000;

}


#infoBox,

#dashboardBox {

  position:absolute;

  top:60px;

  background:white;

  padding:10px;

  border-radius:8px;

  z-index:1000;

}


#infoBox {

  left:10px;

}


#dashboardBox {

  right:10px;

  width:200px;

}


.legend {

  position:absolute;

  bottom:20px;

  right:10px;

  background:white;

  padding:10px;

  border-radius:10px;

  z-index:1000;

}


/* ===== CURRENT LOCATION BUTTON ===== */

#currentLocationBtn {

  position:absolute;

  top:110px;

  left:10px;

  width:42px;

  height:42px;

  padding:0;

  border-radius:50%;

  border:1px solid rgba(255,255,255,0.8);

  background:rgba(255,255,255,0.65);

  backdrop-filter:blur(4px);

  -webkit-backdrop-filter:blur(4px);

  box-shadow:0 2px 8px rgba(0,0,0,0.25);

  z-index:2000;

  cursor:pointer;

  font-size:20px;

  display:flex;

  align-items:center;

  justify-content:center;

}


#currentLocationBtn:hover {

  background:rgba(255,255,255,0.85);

}


#currentLocationBtn:disabled {

  opacity:0.6;

  cursor:wait;

}


/* Current location marker */

.current-location-marker {

  background:transparent;

  border:none;

}


.current-location-dot {

  width:16px;

  height:16px;

  border-radius:50%;

  background:#1a73e8;

  border:3px solid white;

  box-shadow:0 0 0 3px rgba(26,115,232,0.25),

             0 2px 8px rgba(0,0,0,0.45);

}


</style>

</head>


<body>


<input id="searchBox" placeholder="Search city...">


<div id="topBar">

  <span>🌍 AirSat AI</span>

  <button onclick="toggleMode()">Switch</button>
</div>


<div id="infoBox">

  Click map to get AQI

</div>


<!-- CURRENT LOCATION BUTTON -->

<button id="currentLocationBtn"

        onclick="getCurrentLocation()"

        title="Use my current location"

        aria-label="Use my current location">

  📍

</button>


<div id="dashboardBox">

  Loading...

</div>


<div class="legend">

  <div>🟩 0–50 Good</div>

  <div>🟨 51–100 Satisfactory</div>

  <div>🟧 101–200 Moderate</div>

  <div>🟥 201–300 Poor</div>

  <div>🟪 301–400 Very Poor</div>

  <div>⬛ 401–500 Severe</div>

</div>


<canvas id="aqiChart"

        style="

        position:absolute;

        bottom:120px;

        left:10px;

        width:250px;

        height:150px;

        background:white;

        padding:10px;

        border-radius:10px;

        z-index:1000;">

</canvas>


<div id="map"></div>


<!-- SAME HEAD + STYLE (NO CHANGE) -->


<!-- SAME HEAD + STYLE (NO CHANGE) -->


<script>


let heatLayer = null;


function loadHeatmap(){

  fetch("/api/cpcb-stations/", {})

  .then(r => r.json())

  .then(res => {

    if(!res || !res.stations)
      return;

    let points = res.stations.map(s => [
      s.latitude,
      s.longitude,
      Math.min(Number(s.aqi) / 500, 1)
    ]);

    if(heatLayer){
      map.removeLayer(heatLayer);
    }

    heatLayer = L.heatLayer(points, {
      radius: 25,
      blur: 20,
      maxZoom: 10
    }).addTo(map);

  })

  .catch(err => {
    console.error("CPCB heatmap error:", err);
  });

}


loadHeatmap();


// ===== TOGGLE =====


let useBackend = false;


function toggleMode(){


  useBackend = !useBackend;


  alert(

    useBackend

      ? "Backend Mode 🚀"

      : "Live API 🌐"

  );


}


// ===== ELEMENTS =====


const dashboardBox = document.getElementById("dashboardBox");


// ===== AQI COLOR =====


function getAQIColor(aqi){

  aqi = Number(aqi);

  if(aqi <= 50)
    return "🟩 Good";

  if(aqi <= 100)
    return "🟨 Satisfactory";

  if(aqi <= 200)
    return "🟧 Moderate";

  if(aqi <= 300)
    return "🟥 Poor";

  if(aqi <= 400)
    return "🟪 Very Poor";

  return "⬛ Severe";

}


// ===== MAP =====


var map =

  L.map('map').setView([22.5, 78.9], 5);


// 🌍 Light


const lightMap = L.tileLayer(


  'https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',


  {


    attribution:'&copy; OpenStreetMap contributors',


    maxZoom:19


  }


);


// 🌙 Dark


const darkMap = L.tileLayer(


  'https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',


  {


    attribution:'&copy; OpenStreetMap contributors',


    maxZoom:19


  }


);


// 🛰️ Satellite


const satelliteMap = L.tileLayer(


  'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',


  {


    attribution:'&copy; Esri',


    maxZoom:19


  }


);


lightMap.addTo(map);


const aqiMarkerLayer =

  L.layerGroup().addTo(map);


function aqiColor(aqi){


  aqi = Number(aqi);


  if(aqi <= 50)

    return '#22a06b';


  if(aqi <= 100)

    return '#f0c419';


  if(aqi <= 200)

    return '#f08a24';


  if(aqi <= 300)

    return '#d6336c';


  if(aqi <= 400)

    return '#7c4dce';


  return '#4b1fa8';


}


function loadAQIMarkers(){

  fetch("/api/cpcb-stations/", {})

  .then(r =>
    r.ok ? r.json() : null
  )

  .then(res => {

    if(!res || !res.stations)
      return;

    aqiMarkerLayer.clearLayers();

    res.stations.forEach(s => {

      const aqi = Number(s.aqi);
      const color = aqiColor(aqi);

      const icon = L.divIcon({

        className:"aqi-marker",

        html:
          '<div style="' +
          'background:'+color+';' +
          'color:white;' +
          'font-weight:bold;' +
          'font-size:12px;' +
          'line-height:20px;' +
          'text-align:center;' +
          'min-width:28px;' +
          'height:20px;' +
          'padding:0 3px;' +
          'border-radius:3px;' +
          'border:1px solid rgba(255,255,255,.9);' +
          'box-shadow:0 1px 3px rgba(0,0,0,.45);' +
          '">' +
          Math.round(aqi) +
          '</div>',

        iconSize:[34,20],
        iconAnchor:[17,10]

      });

      L.marker(
        [s.latitude, s.longitude],
        {icon:icon}
      )

      .bindTooltip(
        '<b>' + s.name + '</b><br>' +
        'Official CPCB AQI: ' + Math.round(aqi) +
        '<br>Updated: ' + (s.observed_at || 'N/A'),
        {direction:"top"}
      )

      .addTo(aqiMarkerLayer);

    });

  })

  .catch(err => {
    console.error("CPCB marker error:", err);
  });

}


L.control.layers(


  {


    "☀ Light":lightMap,


    "🌙 Dark":darkMap,


    "🛰 Satellite":satelliteMap


  },


  {


    "🌫 AQI":aqiMarkerLayer


  }


).addTo(map);


map.on(

  'baselayerchange',

  function(e){


    document

      .getElementById('map')

      .classList

      .toggle(

        'dark-map',

        e.name === '🌙 Dark'

      );


  }

);


// ===== GRAPH =====


let chartData = [];


const chart = new Chart(

  document.getElementById('aqiChart'),

  {


    type:'line',


    data:{


      labels:[],


      datasets:[

        {

          label:"AQI",

          data:[]

        }

      ]


    },


    options:{

      responsive:false

    }


  }

);


function updateGraph(aqi){


  let t =

    new Date().toLocaleTimeString();


  chartData.push(aqi);


  if(chartData.length > 10){


    chartData.shift();


    chart.data.labels.shift();


  }


  chart.data.labels.push(t);


  chart.data.datasets[0].data =

    chartData;


  chart.update();


}


// ===== CORRECT AQI FETCH =====


function getAQI(
  lat,
  lon,
  popup = null
){

  fetch(
    `/pollution/?lat=${lat}&lon=${lon}&t=${Date.now()}`,
    {}
  )

  .then(r => r.json())

  .then(d => {

    console.log(
      "OFFICIAL CPCB RESULT:",
      d
    );

    if(!d || d.error){

      if(popup)
        popup.setContent(
          d.error || "No nearby CPCB station data ❌"
        );

      return;

    }

    let aqi = Number(d.aqi);

    let level =
      getAQIColor(aqi);

    updateGraph(aqi);

    let oldAQI =
      window.prevAQI || 0;

    window.prevAQI = aqi;

    let blink =
      Math.abs(oldAQI - aqi) > 5
        ? "blink"
        : "";

    const stationDistance =
      d.station_distance_km != null
        ? Number(d.station_distance_km).toFixed(2) + " km"
        : "N/A";

    const observed =
      d.observed_at
        ? new Date(d.observed_at).toLocaleString()
        : "N/A";

    const sourceLabel =
      d.source || "AQI provider";

    const methodLabel =
      d.aqi_method || "";


    dashboardBox.innerHTML = `

      <b>Dashboard</b><br>

      <b>${d.station}</b><br>

      AQI:
      <span class="${blink}">
        ${aqi}
      </span><br>

      ${level}<br>

      📍 Station distance:
      ${stationDistance}<br>

      🕒 Updated:
      ${observed}<br>

      📡 Source:
      ${sourceLabel}<br>

      🔮 Future AQI:
      <span id="prediction">
        Loading...
      </span>

    `;

    if(popup){

      popup.setContent(`

        <b>${d.station}</b><br>

        <b>AQI:</b>
        ${aqi}<br>

        ${level}<br>

        <small>${sourceLabel}</small><br>

        <small>${methodLabel}</small><br>

        📍 Distance:
        ${stationDistance}<br>

        🕒 ${observed}

      `);

    }

    fetch(
      "/api/predict/",
      {}
    )

    .then(r => r.json())

    .then(p => {

      const prediction =
        document.getElementById(
          "prediction"
        );

      if(prediction){

        prediction.innerText =
          p.prediction;

      }

    });

  })

  .catch(err => {

    console.error(
      "CPCB AQI error:",
      err
    );

    if(popup)
      popup.setContent(
        "Current AQI data is temporarily unavailable."
      );

  });

}


// ===== CURRENT LOCATION =====


let currentLocationMarker = null;


let currentLocationPopup = null;


function getCurrentLocation(){


  const button =

    document.getElementById(

      "currentLocationBtn"

    );


  if(!navigator.geolocation){


    alert(

      "Geolocation is not supported by this browser."

    );


    return;


  }


  button.disabled = true;

  button.innerText = "⏳";


  navigator.geolocation.getCurrentPosition(


    function(position){


      const lat =

        position.coords.latitude;


      const lon =

        position.coords.longitude;


      window.lastLat = lat;


      window.lastLon = lon;


      map.flyTo(

        [lat, lon],

        13

      );


      // Remove previous current location marker


      if(currentLocationMarker){


        map.removeLayer(

          currentLocationMarker

        );


      }


      // Create current location marker


      currentLocationMarker =

        L.marker(

          [lat, lon],

          {

            icon:L.divIcon({

              className:"current-location-marker",

              html:'<div class="current-location-dot"></div>',

              iconSize:[22,22],

              iconAnchor:[11,11]

            })

          }

        ).addTo(map);


      currentLocationPopup =

        L.popup({

          closeButton:true

        })


        .setLatLng(

          [lat, lon]

        )


        .setContent(`

          <b>📍 Current Location</b><br>

          Loading AQI...

        `);


      currentLocationMarker

        .bindPopup(

          currentLocationPopup

        )

        .openPopup();


      getAQI(

        lat,

        lon,

        currentLocationPopup

      );


      button.disabled = false;

      button.innerText = "📍";


    },


    function(error){


      button.disabled = false;

      button.innerText = "📍";


      if(error.code === 1){


        alert(

          "Location permission was denied. Please allow location access for AirSat."

        );


      }


      else if(error.code === 2){


        alert(

          "Your current location could not be determined."

        );


      }


      else if(error.code === 3){


        alert(

          "Location request timed out. Please try again."

        );


      }


      else{


        alert(

          "Unable to get your current location."

        );


      }


    },


    {


      enableHighAccuracy:true,

      timeout:15000,

      maximumAge:0


    }


  );


}


// ===== FIXED MAP CLICK =====


map.on('click', function(e){


  let lat =

    e.latlng.lat;


  let lon =

    e.latlng.lng;


  window.lastLat = lat;


  window.lastLon = lon;


  let popup = L.popup()


    .setLatLng(

      [lat, lon]

    )


    .setContent(

      "Loading AQI..."

    )


    .openOn(map);


  // PASS popup here


  getAQI(

    lat,

    lon,

    popup

  );


});


// =====================================================

// ===== SEARCH WITH REAL GEOGRAPHICAL BOUNDARY =====

// =====================================================


let searchMarker = null;


let boundaryLayer = null;


document

  .getElementById("searchBox")

  .addEventListener(

    "keydown",

    function(e){


      if(e.key !== "Enter"){

        return;

      }


      const searchText =

        this.value.trim();


      if(!searchText){

        return;

      }


      let query =

        searchText + ", India";


      /*

       * polygon_geojson=1 asks Nominatim

       * to return the actual geographical

       * boundary when one is available.

       */


      fetch(

        `https://nominatim.openstreetmap.org/search?format=json&polygon_geojson=1&limit=1&q=${encodeURIComponent(query)}`

      )


      .then(r => r.json())


      .then(data => {


        if(data.length === 0){


          alert(

            "Location not found ❌"

          );


          return;


        }


        const result =

          data[0];


        const lat =

          parseFloat(result.lat);


        const lon =

          parseFloat(result.lon);


        window.lastLat =

          lat;


        window.lastLon =

          lon;


        // Remove previous marker


        if(searchMarker){


          map.removeLayer(

            searchMarker

          );


        }


        searchMarker =

          L.marker(

            [lat, lon]

          )


          .bindPopup(

            `<b>${result.display_name}</b>`

          )


          .addTo(map)


          .openPopup();


        // Remove previous boundary


        if(boundaryLayer){


          map.removeLayer(

            boundaryLayer

          );


          boundaryLayer = null;


        }


        /*

         * Draw the REAL boundary.

         *

         * No artificial 5 km circle.

         */


        if(result.geojson){


          boundaryLayer =

            L.geoJSON(

              result.geojson,

              {


                style:{


                  color:"#0066ff",


                  weight:3,


                  opacity:0.9,


                  fillColor:"#3388ff",


                  fillOpacity:0.12


                }


              }

            )


            .addTo(map);


          /*

           * Automatically fit the map

           * to the actual boundary.

           */


          try{


            const bounds =

              boundaryLayer.getBounds();


            if(bounds.isValid()){


              map.fitBounds(

                bounds,

                {


                  padding:[

                    30,

                    30

                  ],


                  maxZoom:12


                }

              );


            }


          }


          catch(error){


            console.warn(

              "Could not fit boundary:",

              error

            );


          }


        }


        else {


          /*

           * Some Nominatim results may not

           * provide a polygon boundary.

           * In that case we simply keep the

           * marker and center the map.

           */


          map.flyTo(

            [lat, lon],

            12

          );


        }


        // Existing real-time AQI function


        getAQI(

          lat,

          lon

        );


      })


      .catch(error => {


        console.error(

          "Location search failed:",

          error

        );


        alert(

          "Location search failed ❌"

        );


      });


    }

  );


setInterval(

  ()=>{


    if(

      window.lastLat &&

      window.lastLon

    ){


      getAQI(

        window.lastLat,

        window.lastLon

      );


    }


  },

  5000

);


setInterval(

  loadHeatmap,

  10000

);


</script>


</body>


</html>
